name: Release Branch

# Two jobs keep the version in step with the release branches:
#
# next-branch: when a release is published (the draft from cd.yml), opens release/v<next minor> from the
#   released commit and sets the version in all four sources with tools/ci/set-version.ps1.
# set-version: when release/vX.Y.Z is created by hand, sets the version in all four sources to X.Y.Z.
#
# Branches pushed with GITHUB_TOKEN do not trigger `create` events. That is why the branch next-branch opens never
# runs set-version: next-branch sets the version itself.
#
# Run it by hand (workflow_dispatch) to try next-branch: with dry_run (the default) it only reports what it would do.
on:
  release:
    types: [published]
  create:
  workflow_dispatch:
    inputs:
      released_version:
        description: Version that was released, for example 0.3.0 (the next branch is release/v0.4.0)
        type: string
        required: true
      dry_run:
        description: Dry run (report only, never push)
        type: boolean
        default: true

concurrency:
  group: release-branch-${{ github.event.release.tag_name || inputs.released_version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  next-branch:
    name: Open next release branch
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      INPUT_VERSION: ${{ inputs.released_version }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next release branch
        shell: bash
        run: |
          released="${TAG#v}"
          if [ -z "$TAG" ]; then released="$INPUT_VERSION"; fi
          if ! [[ "$released" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Bad version::'${released}' is not a version of the form X.Y.Z."
            exit 1
          fi
          IFS=. read -r major minor _ <<< "$released"
          next="${major}.$((10#$minor + 1)).0"
          branch="release/v${next}"
          echo "Released ${released}; next release branch is ${branch}."
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
            echo "::notice title=Next release branch exists::${branch} already exists; nothing to do."
            echo "Next release branch ${branch} already exists; not changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would open ${branch} from ${GITHUB_SHA}, set the version to ${next} and push it."
            echo "Dry run: would open ${branch} (version ${next}) from ${GITHUB_SHA}. Nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch" "$GITHUB_SHA"
          pwsh tools/ci/set-version.ps1 -Version "$next"
          git add -A src
          git -c user.name='github-actions[bot]' -c user.email='41898173+github-actions[bot]@users.noreply.github.com' \
            commit -m "Start ${next} development" -m "Opened automatically after v${released} was released."
          git push origin "HEAD:refs/heads/${branch}"
          echo "::notice title=Next release branch::Opened ${branch} with version ${next}."
          echo "Opened next release branch ${branch} (version ${next})." >> "$GITHUB_STEP_SUMMARY"

  set-version:
    name: Set version from branch name
    if: github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        shell: bash
        run: |
          if ! [[ "$BRANCH" =~ ^release/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error title=Bad release branch name::${BRANCH} is not named release/vX.Y.Z (for example release/v0.4.0). Delete it and create the branch again with a version in its name."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          pwsh tools/ci/set-version.ps1 -Version "$version"
          if git diff --quiet; then
            echo "::notice title=Version already set::${BRANCH} already has ${version}; nothing to commit."
            exit 0
          fi
          git add -A src
          git -c user.name='github-actions[bot]' -c user.email='41898173+github-actions[bot]@users.noreply.github.com' \
            commit -m "Set version to ${version}" -m "Matches the branch name ${BRANCH}."
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "::notice title=Version set::Set ${BRANCH} to version ${version}."
