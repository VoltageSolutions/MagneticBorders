name: Docs CD

# Push to main: build the site (strict) and deploy it to GitHub Pages. docs-ci.yml checks pull requests.
# Needs Settings > Pages > Source = GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'tools/ci/**'
      - '.github/workflows/docs-cd.yml'
  workflow_dispatch:

concurrency:
  group: docs-cd
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build site
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # publish builds with --strict and moves the site to artifacts/docs/x64.
      - name: Build site
        run: pwsh tools/ci/run.ps1 -Target docs -Steps restore,publish -Arch x64 -Ci

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: artifacts/docs/x64
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
