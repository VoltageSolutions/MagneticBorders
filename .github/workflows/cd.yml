name: CD

# A merged release branch lands on main. When v<version> has no release yet, this builds every engine and the
# settings app for x64 and arm64, packages the primary C++ zips plus Rust and C# comparison zips per architecture,
# publishes the GitHub release v<version>, and opens the next release branch release/vX.(Y+1).0 with its version set.
# Builds are not tested again here: the pull request already ran CI.
#
# The next branch is opened here, not by a workflow that listens for the release: a release or branch created with
# GITHUB_TOKEN does not start other workflows. For the same reason the Release Branch workflow (release-branch.yml)
# never runs for the branch this workflow opens, so this workflow sets the version itself.
#
# Run it by hand (workflow_dispatch) with dry_run to build and package without publishing; the next-branch job then
# only reports what it would do.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'zensical.toml'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package, but do not publish the release or open the next release branch
        type: boolean
        default: false

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # write: a draft release (made by hand) is only visible to a token that can push, and the lookup must see it.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: pwsh tools/ci/check-version.ps1

      - name: Look for an existing release
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::Release v${VERSION} already exists; nothing to build."
            echo "Release v${VERSION} already exists; nothing was built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.target }} ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [cpp, rust, dotnet, settings]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.target == 'dotnet' || matrix.target == 'settings'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Rust toolchain
        if: matrix.target == 'rust'
        working-directory: src/engines/rust
        run: rustup toolchain install

      - name: Restore, build and publish
        run: pwsh tools/ci/run.ps1 -Target ${{ matrix.target }} -Steps restore,build,publish -Arch ${{ matrix.arch }} -Ci

      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.target }}-${{ matrix.arch }}
          path: artifacts/${{ matrix.target }}/${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error

  package:
    name: Package
    needs: [prepare, publish]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: artifacts/in

      # TODO: code signing. Sign the engine exes and the settings app exe and dlls here, before the zips are made.
      - name: Package
        run: pwsh tools/ci/package.ps1 -Version $env:VERSION -InputDir artifacts/in -OutDir artifacts/release

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Create release
        shell: bash
        run: |
          notes="## Download

          Pick the x64 or arm64 zip: MagneticBorders-${VERSION}-x64.zip or MagneticBorders-${VERSION}-arm64.zip.
          Most PCs are x64. Windows on Arm devices use arm64.
          Each zip holds MagneticBorders.exe, the settings app in settings/, and LICENSE.
          Verify downloads with SHA256SUMS.txt.

          ## Comparison builds

          The -rust and -dotnet zips are Rust and C# builds of the same app, for performance comparison.
          Run only one build at a time."
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "v${VERSION}" --notes "$notes" \
            release/*.zip release/SHA256SUMS.txt
          echo "Published release v${VERSION}." >> "$GITHUB_STEP_SUMMARY"

  # After a release, open the branch for the next minor version (release/vX.(Y+1).0) with the version already set.
  next-branch:
    name: Open next release branch
    needs: [prepare, release]
    # Runs after the release was published, or in a dry run (release is skipped then) to report what it would do.
    if: >-
      !cancelled() && needs.prepare.outputs.skip != 'true' &&
      (needs.release.result == 'success' || inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASED: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next release branch
        shell: bash
        run: |
          IFS=. read -r major minor _ <<< "$RELEASED"
          next="${major}.$((10#$minor + 1)).0"
          branch="release/v${next}"
          echo "Released ${RELEASED}; next release branch is ${branch}."
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
            echo "::notice title=Next release branch exists::${branch} already exists; nothing to do."
            echo "Next release branch ${branch} already exists; not changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would open ${branch} from ${GITHUB_SHA}, set the version to ${next} and push it."
            echo "Dry run: would open ${branch} (version ${next}) from ${GITHUB_SHA}. Nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch" "$GITHUB_SHA"
          pwsh tools/ci/set-version.ps1 -Version "$next"
          pwsh tools/ci/check-version.ps1 -Branch "$branch"
          git add -A src
          git -c user.name='github-actions[bot]' -c user.email='41898173+github-actions[bot]@users.noreply.github.com' \
            commit -m "Start ${next} development" -m "Opened automatically after v${RELEASED} was released."
          git push origin "HEAD:refs/heads/${branch}"
          echo "::notice title=Next release branch::Opened ${branch} with version ${next}."
          echo "Opened next release branch ${branch} (version ${next})." >> "$GITHUB_STEP_SUMMARY"

  # TODO: Microsoft Store job (needs: package), not implemented yet.
  #   - Build an MSIX for the C++ build only (x64 and arm64), from the published C++ engine and settings app.
  #   - Combine both MSIX packages into one x64+arm64 .msixbundle (MakeAppx.exe bundle).
  #   - Sign the package and bundle (certificate in a secret, signtool), then submit to Partner Center.
