name: CodeQL

# Pull requests, a monthly scan, and the CodeQL and Coverage workflow (codeql-and-coverage.yml), which calls this
# workflow on every push to main so pull requests are compared against a current baseline.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'zensical.toml'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engines are Windows-only code, so the extractors run on Windows.
          # C++ is traced from a real build: without the Windows SDK headers, build-mode none misreads
          # macros such as CALLBACK and reports unreachable code and unread variables that are not there.
          - { language: c-cpp, os: windows-latest, build-mode: manual }
          - { language: csharp, os: windows-latest, build-mode: none }
          - { language: rust, os: windows-latest, build-mode: none }
          - { language: actions, os: ubuntu-latest, build-mode: none }
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Only the shipped app: for a traced build, paths-ignore cannot drop the tests and fixture runner.
      - name: Build C++
        if: matrix.build-mode == 'manual'
        shell: pwsh
        env:
          MB_BUILD_TESTS: 'OFF'
        run: pwsh tools/ci/run.ps1 -Target cpp -Steps restore,build -Arch x64 -Ci

      # The C++ results are uploaded after the filter below, the other languages directly.
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: ${{ matrix.language == 'c-cpp' && 'never' || 'always' }}
          output: sarif-results

      # FetchContent downloads nlohmann/json and GoogleTest into src/engines/cpp/build/, inside the checkout, so the
      # traced build reports their headers. paths-ignore does not apply to a traced build; this drops those results.
      - name: Drop results in downloaded C++ dependencies
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem sarif-results -Filter *.sarif) {
            $sarif = Get-Content -Raw $file.FullName | ConvertFrom-Json -Depth 100
            $dropped = 0
            foreach ($run in $sarif.runs) {
              $kept = @($run.results | Where-Object {
                $uri = $_.locations[0].physicalLocation.artifactLocation.uri
                -not ($uri -like 'src/engines/cpp/build/*' -or $uri -like '*/_deps/*')
              })
              $dropped += @($run.results).Count - $kept.Count
              $run.results = $kept
            }
            $sarif | ConvertTo-Json -Depth 100 -Compress | Set-Content -NoNewline -Encoding utf8NoBOM $file.FullName
            Write-Host "$($file.Name): dropped $dropped results in downloaded dependencies."
          }

      - uses: github/codeql-action/upload-sarif@v4
        if: matrix.language == 'c-cpp'
        with:
          sarif_file: sarif-results
          category: '/language:${{ matrix.language }}'
