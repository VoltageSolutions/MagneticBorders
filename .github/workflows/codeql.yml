name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '23 4 1 * *'   # monthly, 1st of the month
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engines are Windows-only code, so the extractors run on Windows.
          - { language: c-cpp, os: windows-latest }
          - { language: csharp, os: windows-latest }
          - { language: rust, os: windows-latest }
          - { language: actions, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
