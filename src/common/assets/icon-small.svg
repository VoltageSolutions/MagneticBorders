<svg xmlns="http://www.w3.org/2000/svg" viewBox="63.75 26.25 160 160" width="256" height="256">
  <title>Magnetic Borders</title>
  <!-- Small-size variant (16-32 px): magnet only, framed tightly. Full icon: icon.svg -->
  <!-- All gradients share one ambient light from the top-left at 120 degrees (Windows app icon guidance),
       defined in screen space so the rotated magnet parts all shade the same way. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="-62.8" y1="-13.2" x2="62.8" y2="-46.8"><stop offset="0" stop-color="#B4BAC2"/><stop offset="1" stop-color="#8A919B"/></linearGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="-70.1" y1="41.5" x2="-21.9" y2="28.5"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#D62F3A"/></linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="21.9" y1="41.5" x2="70.1" y2="28.5"><stop offset="0" stop-color="#5AA9FF"/><stop offset="1" stop-color="#1F5FD6"/></linearGradient>
  </defs>

  <!-- Magnet: drawn opening-down, turned 45 degrees so the opening faces down-left -->
  <g transform="translate(150 100) rotate(45)">
    <!-- Body: filled outline (outer r 63, inner r 29) so its leg ends get the same 7 px corner radius as the poles -->
    <path d="M -63 -8 A 63 63 0 0 1 63 -8 V 5 A 7 7 0 0 1 56 12 H 36 A 7 7 0 0 1 29 5 V -8 A 29 29 0 0 0 -29 -8 V 5 A 7 7 0 0 1 -36 12 H -56 A 7 7 0 0 1 -63 5 Z" fill="url(#body)"/>
    <rect x="-63" y="14" width="34" height="42" rx="7" fill="url(#red)"/>
    <rect x="29" y="14" width="34" height="42" rx="7" fill="url(#blue)"/>
  </g></svg>
